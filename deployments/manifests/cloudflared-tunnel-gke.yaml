#
# Cloudflare Tunnel connector for a GKE OSMO deployment. The tunnel, its
# ingress rule and the Access application are managed elsewhere (see
# infra: services/zt-connector/osmo.tf and docs/runbooks/osmo-access.md); this
# Deployment only runs cloudflared with a remotely managed configuration and
# forwards edge traffic to the in-cluster gateway Service.
#
# Prerequisite, created by the operator and never committed:
#   kubectl -n osmo create secret generic cloudflared-tunnel-token \
#     --from-file=token=/dev/stdin
# The token is the base64 JSON {"a": account_id, "t": tunnel_id, "s": secret}.
#
# Apply: kubectl apply -f deployments/manifests/cloudflared-tunnel-gke.yaml
# Offline: kubectl scale -n osmo deploy/cloudflared-tunnel --replicas=0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-tunnel
  namespace: osmo
  labels:
    app.kubernetes.io/name: cloudflared-tunnel
    app.kubernetes.io/part-of: osmo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared-tunnel
        app.kubernetes.io/part-of: osmo
    spec:
      # Platform component: stays with the OSMO services on the cpu pool.
      nodeSelector:
        cloud.google.com/gke-nodepool: cpu
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cloudflared-tunnel
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Secret volume files are root-owned; fsGroup gives the cloudflared
        # group read access to the token without making it world-readable.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          # Same pinned release the infra connectors run.
          image: cloudflare/cloudflared:2026.6.0@sha256:ba461b8aa9c042156dbd39c38657fe7431bafa063220eab8d5330a523863da9f
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token-file
            - /etc/cloudflared/token
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: token
              mountPath: /etc/cloudflared
              readOnly: true
      volumes:
        - name: token
          secret:
            secretName: cloudflared-tunnel-token
            defaultMode: 0440
