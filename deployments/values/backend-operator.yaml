#
# Backend operator values for the minimal deployment.
#
# Modeled on the canonical docs example:
#   external/docs/deployment_guide/appendix/deploy_minimal.rst
#
# Consumed by deploy-osmo-minimal.sh via `helm install -f`. Cluster-specific
# values (image registry/tag, NGC pull secret name, namespaces, serviceUrl)
# are injected with `--set` at install time. Edit the rest of this file to
# customize an operator deploy.

global:
  # osmoImageLocation + osmoImageTag injected via --set
  # serviceUrl injected via --set (typically http://osmo-gateway.<ns>.svc.cluster.local)
  agentNamespace: osmo-operator
  backendNamespace: osmo-workflows
  backendName: default
  accountTokenSecret: osmo-operator-token
  loginMethod: token
  # The chart default is DEBUG, which logs every WebSocket frame. INFO keeps
  # connection, reconnect and node-update events.
  logs:
    logLevel: INFO

services:
  backendListener:
    # Sized from a live CPU-only cluster: the listener idles around 250m and
    # 210Mi while watching nodes, pods and events.
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    # progress_check on a drained or busy node has exceeded the 15s default and
    # restarted the listener; require consecutive failures before restarting.
    livenessProbe:
      failureThreshold: 3
      periodSeconds: 30
      timeoutSeconds: 30
  backendWorker:
    resources:
      requests:
        cpu: "125m"
        memory: "192Mi"
      limits:
        cpu: "250m"
        memory: "384Mi"

sidecars:
  otel:
    enabled: false

# PodMonitor disabled to avoid CRD errors on clusters without prometheus-operator
podMonitor:
  enabled: false
